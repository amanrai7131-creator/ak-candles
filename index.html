<script>
const SUPABASE_URL =
"https://xgmgrwsszjbifoxclwta.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WeRFVhRBNdwHC8hqMdzUrA_eKEE4fDP";

async function testSupabase(){

  const box = document.getElementById("products");

  box.innerHTML = `
    <div class="loading">
      🔄 Supabase testing...
    </div>
  `;

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/products?select=*";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    const text = await response.text();

    box.innerHTML = `
      <div class="error">
        <h3>Supabase Test</h3>
        <p><b>Status:</b> ${response.status}</p>
        <pre style="white-space:pre-wrap;text-align:left;overflow:auto;">
${text.replace(/</g,"&lt;")}
        </pre>
      </div>
    `;

  } catch(error) {

    box.innerHTML = `
      <div class="error">
        <h3>FETCH ERROR</h3>
        <pre>${String(error)}</pre>
      </div>
    `;

  }
}

testSupabase();
</script>
